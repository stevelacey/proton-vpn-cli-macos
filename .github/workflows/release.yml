name: Release

# Bare version tags (e.g. 0.2.0); Proton's own releases are tagged v1.0.5 and so on.
on:
  push:
    tags:
      - '[0-9]*'
  # Builds the wheel without publishing it, to try the build.
  workflow_dispatch: ~

jobs:
  build:
    name: Build wheel
    runs-on: macos-latest
    defaults:
      run:
        working-directory: macos
    steps:
      - uses: actions/checkout@v6

      - name: Check out Proton's core libraries
        run: git submodule update --init --depth 1 vendor/python-proton-core vendor/python-proton-vpn-api-core

      - uses: astral-sh/setup-uv@v7

      - name: Add Rust targets for Apple Silicon and Intel
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - run: uv sync --locked
      - run: uv run pytest

      - name: Build a universal wheel
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            uv run scripts/build-wheel --universal --version "$GITHUB_REF_NAME"
          else
            uv run scripts/build-wheel --universal
          fi

      - name: Check the wheel installs and runs
        run: |
          uvx --from dist/*.whl vpn help
          uvx --from dist/*.whl protonvpn --help

      - uses: actions/upload-artifact@v5
        with:
          name: wheel
          path: macos/dist/*.whl

  pypi-publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: build
    if: github.ref_type == 'tag'
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: wheel
          path: dist

      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs: build
    if: github.ref_type == 'tag'
    permissions:
      contents: write
    outputs:
      url: ${{ steps.upload.outputs.url }}
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: wheel
          path: dist

      - name: Create the release with the wheel
        id: upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.whl --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
          wheel=$(basename dist/*.whl)
          echo "url=https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/$wheel" >> "$GITHUB_OUTPUT"

  tap-publish:
    name: Publish to tap
    runs-on: ubuntu-latest
    needs: github-release
    steps:
      - name: Trigger homebrew-tap update
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          repository: stevelacey/homebrew-tap
          event-type: update-formula
          client-payload: >-
            {
              "formula": "proton-vpn-cli",
              "url": "${{ needs.github-release.outputs.url }}",
              "version": "${{ github.ref_name }}"
            }
